<!doctype html>
<html lang="uk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Anagram Game Documentation Demo</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        color: #111827;
        background: #f3f4f6;
      }

      main {
        max-width: 880px;
        margin: 0 auto;
        padding: 48px 20px;
      }

      section {
        margin-bottom: 24px;
        padding: 24px;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 8px;
      }

      code {
        padding: 2px 6px;
        border-radius: 4px;
        background: #eef2ff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Anagram Game: локальна документація</h1>
      <section>
        <h2>1. Generated docs</h2>
        <p>Запустіть <code>npm run docs</code> і відкрийте <code>docs/generated/index.html</code>.</p>
      </section>
      <section>
        <h2>2. Storybook</h2>
        <p>Запустіть <code>npm run storybook</code> і відкрийте <code>http://localhost:6006</code>.</p>
      </section>
      <section>
        <h2>3. GDPR</h2>
        <p>У застосунку є cookie popup з категоріями Necessary, Preferences, Analytics і Marketing.</p>
      </section>
    </main>
  </body>
</html>
